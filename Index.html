<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Trading - Nasdaq Monitor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.5rem; color: #38bdf8; margin-top: 0; }
        .card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .status { font-weight: bold; color: #4ade80; }
        .btn {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
        }
        .btn:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Monitor de Sesión NY</h1>
        <div class="card">
            <p>Estado actual:</p>
            <p class="status" id="market-status">Calculando sesión...</p>
        </div>
        <div class="card">
            <p><strong>Activo principal:</strong> Nasdaq (NQ / MNQ)</p>
            <p><strong>Hora actual (CET):</strong> <span id="clock">--:--:--</span></p>
        </div>
        <a href="https://wa.me/?text=¡Hola!%20Consulta%20el%20panel%20de%20control%20en%20tiempo%20real:" class="btn" target="_blank">Compartir por WhatsApp 📲</a>
    </div>

    <script>
        function updateClockAndStatus() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();

            // Lógica sencilla de horario CET
            const hours = now.getUTCHours() + 1; // Ajuste aproximado España peninsular
            const minutes = now.getMinutes();
            const totalMins = hours * 60 + minutes;

            const statusEl = document.getElementById('market-status');
            if (totalMins >= 930 && totalMins <= 1050) { // 15:30 a 17:30 aprox
                statusEl.innerText = "🟢 Ventana Operativa Activa (Wall Street)";
                statusEl.style.color = "#4ade80";
            } else {
                statusEl.innerText = "🟡 Fuera de horario óptimo / Mercado cerrado";
                statusEl.style.color = "#fbbf24";
            }
        }
        setInterval(updateClockAndStatus, 1000);
        updateClockAndStatus();
    </script>
</body>
</html>
